name: Build
on: [push]

permissions:
  contents: read

jobs:
  linux-build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/hairyhenderson/gomplate-ci-build:latest@sha256:ce5eb54ce18413acb3f036f3c08d9d335414c0e4b1ddc7dddb4a46862710c5c8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: make build
      - run: make test
  lint:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/hairyhenderson/gomplate-ci-build:latest@sha256:ce5eb54ce18413acb3f036f3c08d9d335414c0e4b1ddc7dddb4a46862710c5c8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: make lint
